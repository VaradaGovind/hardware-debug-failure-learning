name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Regression & Integrity Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install required RTL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Restore historical artifact line endings
        run: |
          python -c "
          import json, os, hashlib
          with open('results/reports/v12_frozen_artifacts.json') as f:
              data = json.load(f)
          for path, exp_sha in data['frozen_artifacts_sha256'].items():
              if os.path.exists(path):
                  with open(path, 'rb') as f:
                      content = f.read()
                  crlf = content.replace(b'\r\n', b'\n').replace(b'\n', b'\r\n')
                  if hashlib.sha256(crlf).hexdigest() == exp_sha and hashlib.sha256(content).hexdigest() != exp_sha:
                      with open(path, 'wb') as f:
                          f.write(crlf)
          "

      - name: Run full test suite
        run: pytest -q

      - name: Run V11 regression suite
        run: pytest tests/test_v11_generalization.py -v

      - name: Run V12 regression suite
        run: pytest tests/test_v12_external_validation.py -v

      - name: Run historical integrity check
        run: python scripts/check_integrity.py
